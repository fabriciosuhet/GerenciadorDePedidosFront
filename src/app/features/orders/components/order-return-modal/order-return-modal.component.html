@if (orderId(); as id) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-zinc-950/70 p-4 backdrop-blur-xs"
    role="dialog"
    aria-modal="true"
    aria-labelledby="order-return-modal-title"
  >
    <div
      class="w-full max-w-md rounded-3xl border border-zinc-200 bg-white p-6 shadow-2xl dark:border-zinc-800 dark:bg-zinc-900"
    >
      <div class="flex items-start justify-between gap-4">
        <div>
          <span
            class="inline-block rounded-lg bg-violet-100 px-2.5 py-0.5 font-display text-xs font-bold text-violet-900 dark:bg-violet-950/70 dark:text-violet-300"
          >
            DEVOLUÇÃO DE PEDIDO
          </span>
          <h2
            id="order-return-modal-title"
            class="mt-1.5 font-display text-xl font-extrabold text-zinc-950 dark:text-white"
          >
            Devolver Pedido #{{ id }}
          </h2>
          <p class="mt-1 text-xs text-zinc-500 dark:text-zinc-400">
            Registre o motivo da devolução e informe se os itens devem retornar ao estoque.
          </p>
        </div>

        <button
          type="button"
          (click)="handleClose()"
          [disabled]="saving()"
          aria-label="Fechar modal de devolução"
          class="rounded-xl border border-zinc-200 p-2 text-zinc-500 transition hover:bg-zinc-100 hover:text-zinc-900 disabled:cursor-not-allowed disabled:opacity-50 dark:border-zinc-800 dark:text-zinc-400 dark:hover:bg-zinc-800 dark:hover:text-white"
        >
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="mt-5 space-y-4">
        <div>
          <label
            for="return-order-reason"
            class="mb-1.5 block font-display text-xs font-semibold uppercase tracking-wider text-zinc-600 dark:text-zinc-400"
          >
            Motivo da devolução
          </label>
          <textarea
            id="return-order-reason"
            rows="3"
            formControlName="motivo"
            (input)="onMotivoInput()"
            placeholder="Ex: Produto entregue com avaria na embalagem ou desistência do cliente"
            class="w-full rounded-2xl border border-zinc-200 bg-zinc-50/70 px-3.5 py-2.5 text-sm text-zinc-900 placeholder:text-zinc-400 transition focus:border-lime-500 focus:bg-white dark:focus:bg-zinc-900 focus:outline-none dark:border-zinc-800 dark:bg-zinc-950 dark:text-white dark:placeholder:text-zinc-500 dark:focus:border-lime-400"
          ></textarea>
        </div>

        <label
          for="return-order-restock"
          class="flex cursor-pointer items-start gap-3 rounded-2xl border border-zinc-200 bg-zinc-50/70 p-3.5 dark:border-zinc-800 dark:bg-zinc-950"
        >
          <input
            id="return-order-restock"
            type="checkbox"
            formControlName="retornarAoEstoque"
            class="mt-0.5 h-4 w-4 rounded border-zinc-300 text-lime-500 focus:ring-lime-500 dark:border-zinc-700 dark:bg-zinc-900"
          />
          <span class="text-xs leading-relaxed text-zinc-700 dark:text-zinc-300">
            <strong class="block font-bold text-zinc-900 dark:text-white">
              Retornar itens ao estoque
            </strong>
            Estorna automaticamente as unidades do pedido e registra a movimentação com motivo Devolução.
          </span>
        </label>

        @if (displayedError(); as error) {
          <div
            role="alert"
            class="rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-xs font-semibold text-rose-700 dark:border-rose-900/60 dark:bg-rose-950/60 dark:text-rose-300"
          >
            {{ error }}
          </div>
        }

        <div class="flex flex-col-reverse justify-end gap-2.5 border-t border-zinc-100 pt-4 sm:flex-row dark:border-zinc-800">
          <button
            type="button"
            (click)="handleClose()"
            [disabled]="saving()"
            class="inline-flex items-center justify-center rounded-xl border border-zinc-200 bg-white px-4 py-2 text-sm font-bold text-zinc-700 transition hover:bg-zinc-100 disabled:cursor-not-allowed disabled:opacity-50 dark:border-zinc-700 dark:bg-zinc-800 dark:text-zinc-200 dark:hover:bg-zinc-700"
          >
            Voltar
          </button>
          <button
            type="submit"
            [disabled]="saving()"
            class="inline-flex items-center justify-center gap-2 rounded-xl bg-violet-600 px-5 py-2 text-sm font-bold text-white shadow-xs transition hover:bg-violet-700 disabled:cursor-not-allowed disabled:opacity-60"
          >
            {{ saving() ? 'Registrando...' : 'Confirmar devolução' }}
          </button>
        </div>
      </form>
    </div>
  </div>
}
