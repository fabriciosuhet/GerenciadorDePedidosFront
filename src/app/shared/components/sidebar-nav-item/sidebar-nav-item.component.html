<a
  [routerLink]="route()"
  routerLinkActive
  #rla="routerLinkActive"
  [routerLinkActiveOptions]="{ exact: exact() }"
  (click)="navigated.emit()"
  class="flex items-center gap-3 rounded-xl px-3.5 py-2.5 text-sm transition"
  [class]="
    rla.isActive
      ? 'bg-lime-400 font-bold text-zinc-950 shadow-xs'
      : 'font-medium text-zinc-700 hover:bg-zinc-100 hover:text-zinc-950 dark:text-zinc-300 dark:hover:bg-zinc-900 dark:hover:text-white'
  "
>
  <ng-content />
  <span class="flex-1">{{ label() }}</span>
  @if (badge(); as count) {
    @if (count > 0) {
      <span
        class="rounded-full px-2 py-0.5 font-display text-xs font-extrabold"
        [class]="
          rla.isActive
            ? 'bg-zinc-950 text-lime-400'
            : 'bg-amber-400/25 text-amber-900 dark:bg-amber-400/20 dark:text-amber-300'
        "
      >
        {{ count }}
      </span>
    }
  }
</a>
