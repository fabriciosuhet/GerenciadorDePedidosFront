<div
  class="flex flex-col items-center justify-between gap-3 border-t border-zinc-100 bg-zinc-50/50 px-6 py-4 text-xs text-zinc-500 sm:flex-row dark:border-zinc-800/80 dark:bg-zinc-900/50 dark:text-zinc-400"
>
  <div class="flex flex-wrap items-center gap-3">
    <p>
      Mostrando <span class="font-display font-bold text-zinc-900 dark:text-zinc-100">{{ startIndex() }}</span>–<span class="font-display font-bold text-zinc-900 dark:text-zinc-100">{{ endIndex() }}</span>
      de <span class="font-display font-bold text-zinc-900 dark:text-zinc-100">{{ totalItems() }}</span> registro(s)
    </p>

    @if (showPageSizeSelector()) {
      <label class="inline-flex items-center gap-1.5 text-xs text-zinc-500 dark:text-zinc-400">
        <span>Por página:</span>
        <select
          [value]="pageSize()"
          (change)="onPageSizeSelect($event)"
          aria-label="Itens por página"
          class="rounded-lg border border-zinc-200 bg-white px-2 py-1 font-display text-xs font-semibold text-zinc-800 focus:border-lime-500 focus:outline-none dark:border-zinc-700 dark:bg-zinc-800 dark:text-zinc-100"
        >
          @for (size of pageSizeOptions(); track size) {
            <option [value]="size" [selected]="size === pageSize()">{{ size }}</option>
          }
        </select>
      </label>
    }
  </div>

  <div class="inline-flex items-center gap-2">
    <button
      type="button"
      [disabled]="currentPage() <= 1"
      (click)="goToPage(currentPage() - 1)"
      class="inline-flex items-center rounded-xl border border-zinc-200 bg-white px-3 py-1.5 text-xs font-semibold text-zinc-700 transition hover:bg-zinc-100 disabled:cursor-not-allowed disabled:opacity-40 dark:border-zinc-800 dark:bg-zinc-900 dark:text-zinc-200 dark:hover:bg-zinc-800"
    >
      ← Anterior
    </button>
    <span class="rounded-lg bg-zinc-100 px-2.5 py-1 font-display text-xs font-semibold text-zinc-800 dark:bg-zinc-800 dark:text-zinc-200">
      {{ currentPage() }} / {{ totalPages() }}
    </span>
    <button
      type="button"
      [disabled]="currentPage() >= totalPages()"
      (click)="goToPage(currentPage() + 1)"
      class="inline-flex items-center rounded-xl border border-zinc-200 bg-white px-3 py-1.5 text-xs font-semibold text-zinc-700 transition hover:bg-zinc-100 disabled:cursor-not-allowed disabled:opacity-40 dark:border-zinc-800 dark:bg-zinc-900 dark:text-zinc-200 dark:hover:bg-zinc-800"
    >
      Próxima →
    </button>
  </div>
</div>
