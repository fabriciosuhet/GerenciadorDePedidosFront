@if (items().length > 0) {
  <aside
    class="fixed right-4 bottom-4 z-40 w-full max-w-sm pl-8 sm:pl-0"
    role="status"
    aria-live="polite"
    aria-label="Alerta de estoque baixo"
  >
    <div
      class="overflow-hidden rounded-3xl border border-amber-300/80 bg-white/95 shadow-2xl backdrop-blur-md dark:border-amber-500/40 dark:bg-zinc-900/95"
    >
      <div
        class="flex items-center justify-between gap-3 border-b border-amber-100 bg-amber-50/90 px-4 py-3 dark:border-amber-500/20 dark:bg-amber-950/50"
      >
        <div class="flex items-center gap-2.5">
          <span class="relative flex h-2.5 w-2.5 shrink-0">
            <span
              class="absolute inline-flex h-full w-full animate-ping rounded-full bg-amber-500 opacity-75"
            ></span>
            <span class="relative inline-flex h-2.5 w-2.5 rounded-full bg-amber-500"></span>
          </span>
          <div>
            <p class="font-display text-xs font-extrabold uppercase tracking-wider text-amber-900 dark:text-amber-300">
              Estoque Crítico (≤ 20%)
            </p>
            <p class="text-xs text-amber-800/80 dark:text-amber-200/70">
              {{ items().length }} produto(s) catalogado(s)
            </p>
          </div>
        </div>

        <button
          type="button"
          (click)="dismissed.emit()"
          class="rounded-lg p-1 text-amber-800/70 transition hover:bg-amber-200/50 hover:text-amber-950 dark:text-amber-300/70 dark:hover:bg-amber-900/50 dark:hover:text-amber-100"
          aria-label="Fechar alerta de estoque"
        >
          ✕
        </button>
      </div>

      <div class="max-h-56 divide-y divide-zinc-100 overflow-y-auto px-4 dark:divide-zinc-800">
        @for (item of items(); track item.id) {
          <div class="py-3">
            <div class="flex items-center justify-between gap-2 text-xs">
              <span class="truncate font-bold text-zinc-900 dark:text-white">
                {{ item.name }}
              </span>
              <span
                class="shrink-0 rounded-full px-2 py-0.5 font-display font-bold"
                [class]="
                  item.currentStock === 0
                    ? 'bg-rose-100 text-rose-800 dark:bg-rose-950/70 dark:text-rose-300'
                    : 'bg-amber-100 text-amber-800 dark:bg-amber-950/70 dark:text-amber-300'
                "
              >
                {{ item.currentStock }} un. ({{ item.percentage }}%)
              </span>
            </div>
            <div class="mt-1.5 h-1.5 w-full overflow-hidden rounded-full bg-zinc-100 dark:bg-zinc-800">
              <div
                class="h-full rounded-full transition-all"
                [class]="item.currentStock === 0 ? 'bg-rose-500' : 'bg-amber-500'"
                [style.width.%]="item.percentage"
              ></div>
            </div>
          </div>
        }
      </div>

      <div
        class="flex items-center justify-between border-t border-zinc-100 bg-zinc-50/80 px-4 py-2.5 dark:border-zinc-800 dark:bg-zinc-950/70"
      >
        <span class="text-xs text-zinc-500 dark:text-zinc-400">Reposição recomendada</span>
        <a
          routerLink="/products"
          class="font-display text-xs font-bold text-zinc-950 underline decoration-lime-400 decoration-2 underline-offset-4 hover:text-emerald-700 dark:text-lime-400 dark:hover:text-lime-300"
        >
          Ver produtos →
        </a>
      </div>
    </div>
  </aside>
}
