<div
  class="pointer-events-none fixed top-4 right-4 z-50 flex w-full max-w-sm flex-col gap-2.5 px-4 sm:px-0"
  aria-live="polite"
>
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="pointer-events-auto flex items-start gap-3 rounded-xl border px-4 py-3 text-sm shadow-lg backdrop-blur-sm transition"
      [class]="
        toast.type === 'success'
          ? 'border-emerald-200 bg-emerald-50/95 text-emerald-900 dark:border-emerald-800 dark:bg-emerald-950/90 dark:text-emerald-200'
          : toast.type === 'error'
            ? 'border-rose-200 bg-rose-50/95 text-rose-900 dark:border-rose-800 dark:bg-rose-950/90 dark:text-rose-200'
            : 'border-sky-200 bg-sky-50/95 text-sky-900 dark:border-sky-800 dark:bg-sky-950/90 dark:text-sky-200'
      "
      role="alert"
    >
      <p class="flex-1 font-medium leading-snug">{{ toast.text }}</p>
      <button
        type="button"
        class="shrink-0 rounded-md p-0.5 opacity-60 transition hover:opacity-100"
        (click)="toastService.dismiss(toast.id)"
        aria-label="Fechar notificação"
      >
        ✕
      </button>
    </div>
  }
</div>
